<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glyph Loom</title>
<meta name="description" content="ASCII generative system: turn images, SVG and video into character grids.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- BODY:START -->
<div class="app">
  <div class="stage">
    <div class="top">
      <h1>Glyph Loom</h1>
      <span class="meta" id="meta">—</span>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="vi">VI</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
    <div class="frame" id="frame">
      <canvas id="out" width="800" height="800" aria-label="ASCII output"></canvas>
      <div class="hint" id="hint" data-i18n="hint"></div>
    </div>
    <div class="bar">
      <label class="btn"><span data-i18n="upload"></span><input id="file" type="file" accept="image/*,video/*,.svg"></label>
      <button id="sampleBtn" data-i18n="demo"></button>
      <button id="cloudBtn" data-i18n="demoCloud"></button>
      <button id="playBtn" hidden></button>
      <span style="flex:1"></span>
      <button id="pngBtn" class="primary" data-i18n="png"></button>
      <button id="recBtn" class="rec"></button>
    </div>
  </div>

  <aside class="rail">
    <section>
      <h2 data-i18n="sPresets"></h2>
      <div class="presets" id="presets"></div>
    </section>

    <section>
      <h2 data-i18n="sCharset"></h2>
      <div class="seg" data-seg="ramp"></div>
      <div class="row2"><label for="ramp" data-i18n="custom"></label><input id="ramp" data-k="ramp" type="text" spellcheck="false" placeholder="a;b;c;d"></div>
      <p class="note" data-i18n="rampHint"></p>
      <div class="legend" id="legend" aria-live="polite"></div>
      <div class="row"><label for="cell" data-i18n="cell"></label><input id="cell" data-k="cell" type="range" min="5" max="40" step="1"><output data-o="cell"></output></div>
      <div class="row"><label for="fscale" data-i18n="fscale"></label><input id="fscale" data-k="fscale" type="range" min="0.5" max="1.5" step="0.05"><output data-o="fscale"></output></div>
      <label class="check"><input id="bold" data-k="bold" type="checkbox"> <span data-i18n="bold"></span></label>
    </section>

    <section>
      <h2 data-i18n="sTone"></h2>
      <div class="row"><label for="bright" data-i18n="bright"></label><input id="bright" data-k="bright" type="range" min="-0.5" max="0.5" step="0.01"><output data-o="bright"></output></div>
      <div class="row"><label for="contrast" data-i18n="contrast"></label><input id="contrast" data-k="contrast" type="range" min="0.4" max="3" step="0.05"><output data-o="contrast"></output></div>
      <div class="row"><label for="gamma" data-i18n="gamma"></label><input id="gamma" data-k="gamma" type="range" min="0.3" max="2.5" step="0.05"><output data-o="gamma"></output></div>
      <div class="row"><label for="cut" data-i18n="cut"></label><input id="cut" data-k="cut" type="range" min="0" max="0.9" step="0.01"><output data-o="cut"></output></div>
      <label class="check"><input id="invert" data-k="invert" type="checkbox"> <span data-i18n="invert"></span></label>
    </section>

    <section>
      <h2 data-i18n="sColor"></h2>
      <div class="seg" data-seg="color"></div>
      <div class="zones" id="zonePanel" hidden>
        <p class="note" data-i18n="zoneNote"></p>
        <div class="row"><label for="zoneN" data-i18n="zoneN"></label><input id="zoneN" data-k="zoneN" type="range" min="2" max="8" step="1"><output data-o="zoneN"></output></div>
        <div class="row"><label for="zoneTol" data-i18n="zoneTol"></label><input id="zoneTol" data-k="zoneTol" type="range" min="0.05" max="1" step="0.01"><output data-o="zoneTol"></output></div>
        <div class="zone-list" id="zoneList"></div>
        <button type="button" id="zoneDetect" data-i18n="zoneRedetect"></button>
      </div>
      <div class="row2"><label for="bg" data-i18n="bg"></label><div class="inks"><input id="bg" data-k="bg" type="color"></div></div>
      <div class="nozone row2"><label data-i18n="inks"></label><div class="inks" id="inks"></div></div>
      <div class="nozone row"><label for="inkN" data-i18n="inkN"></label><input id="inkN" data-k="inkN" type="range" min="1" max="8" step="1"><output data-o="inkN"></output></div>
      <div class="nozone row"><label for="sat" data-i18n="sat"></label><input id="sat" data-k="sat" type="range" min="0" max="2.5" step="0.05"><output data-o="sat"></output></div>
      <div class="row"><label for="grain" data-i18n="grain"></label><input id="grain" data-k="grain" type="range" min="0" max="0.5" step="0.01"><output data-o="grain"></output></div>
    </section>

    <section>
      <h2 data-i18n="sLayer"></h2>
      <div class="row"><label for="imgOpacity" data-i18n="imgOpacity"></label><input id="imgOpacity" data-k="imgOpacity" type="range" min="0" max="1" step="0.01"><output data-o="imgOpacity"></output></div>
      <div class="two">
        <select id="imgBlend" data-k="imgBlend" aria-label="Image blend">
          <option value="source-over" data-i18n="imgNormal"></option><option value="multiply" data-i18n="imgMultiply"></option><option value="screen" data-i18n="imgScreen"></option><option value="luminosity" data-i18n="imgLuminosity"></option><option value="overlay" data-i18n="imgOverlay"></option>
        </select>
        <select id="blend" data-k="blend" aria-label="ASCII blend">
          <option value="source-over">ascii: normal</option><option value="multiply">ascii: multiply</option><option value="screen">ascii: screen</option><option value="overlay">ascii: overlay</option><option value="difference">ascii: difference</option><option value="lighter">ascii: add</option>
        </select>
      </div>
      <div class="row"><label for="inkOpacity">ASCII</label><input id="inkOpacity" data-k="inkOpacity" type="range" min="0" max="1" step="0.01"><output data-o="inkOpacity"></output></div>
      <label class="check"><input id="imgGray" data-k="imgGray" type="checkbox"> <span data-i18n="imgGray"></span></label>
    </section>

    <section>
      <h2>Patchwork <label class="check" style="font-size:11px"><input id="patch" data-k="patch" type="checkbox"> <span data-i18n="on"></span></label></h2>
      <div class="row"><label for="block">Block</label><input id="block" data-k="block" type="range" min="2" max="24" step="1"><output data-o="block"></output></div>
      <div class="row"><label for="alt" data-i18n="alt"></label><input id="alt" data-k="alt" type="range" min="0" max="0.8" step="0.01"><output data-o="alt"></output></div>
      <div class="row"><label for="flip" data-i18n="flip"></label><input id="flip" data-k="flip" type="range" min="0" max="0.5" step="0.01"><output data-o="flip"></output></div>
      <div class="row"><label for="reveal" data-i18n="reveal"></label><input id="reveal" data-k="reveal" type="range" min="0" max="0.6" step="0.01"><output data-o="reveal"></output></div>
      <div class="two">
        <select id="altSet" data-k="altSet" aria-label="Second character set"></select>
        <button id="seedBtn" data-i18n="shuffle"></button>
      </div>
    </section>

    <section>
      <h2 data-i18n="sMotion"></h2>
      <div class="row"><label for="flicker">Flicker</label><input id="flicker" data-k="flicker" type="range" min="0" max="0.3" step="0.01"><output data-o="flicker"></output></div>
      <div class="row2"><label for="label">Label</label><input id="label" data-k="label" type="text" placeholder="LOONG_" spellcheck="false"></div>
      <div class="row2"><label for="labelPos" data-i18n="pos"></label>
        <select id="labelPos" data-k="labelPos"><option value="c" data-i18n="posC"></option><option value="bl" data-i18n="posBL"></option><option value="tl" data-i18n="posTL"></option><option value="br" data-i18n="posBR"></option><option value="vl" data-i18n="posVL"></option></select></div>
    </section>

    <section>
      <h2>Output</h2>
      <div class="two">
        <select id="frameSel" data-k="frame" aria-label="Frame">
          <option value="source" data-i18n="frameSource"></option><option value="1">1 : 1</option><option value="0.8">4 : 5</option><option value="0.5625">9 : 16</option><option value="1.7778">16 : 9</option>
        </select>
        <select id="size" data-k="size" aria-label="Width">
          <option value="1080">1080 px</option><option value="1600">1600 px</option><option value="2160">2160 px</option>
        </select>
      </div>
    </section>
  </aside>
</div>
<div class="toast" id="toast" role="status"></div>
<!-- BODY:END -->
<script src="js/i18n.js"></script>
<script src="js/presets.js"></script>
<script src="js/zones.js"></script>
<script src="js/dragon.js"></script>
<script src="js/app.js"></script>
</body>
</html>
